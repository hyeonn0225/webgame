<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AFTER HOURS — 무한 야간근무</title>
<style>
:root{color-scheme:dark;--mint:#bcff69;--muted:#8b9396}*{box-sizing:border-box}body{margin:0;background:#101515;color:#eef1e9;font:14px system-ui,sans-serif;overflow:hidden}button,input{font:inherit}button{cursor:pointer;border:1px solid #39413c;color:#e9eee5;background:#202923;padding:14px 22px;border-radius:6px}button:hover{border-color:var(--mint)}button:disabled{opacity:.35;cursor:default}.primary{background:var(--mint);color:#172011;font-weight:800;border:0}input{background:#111815;border:1px solid #414b40;color:white;padding:14px;width:160px;border-radius:6px;text-transform:uppercase;letter-spacing:3px}canvas{display:block;width:100vw;height:100vh}header{position:fixed;top:0;left:0;right:0;height:76px;padding:0 32px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid #ffffff12;background:#111715e8;z-index:2}.brand{font-weight:900;letter-spacing:2px}.brand span{color:var(--mint)}.tag{font:11px monospace;color:var(--muted);letter-spacing:2px}.panel{position:fixed;inset:76px 0 0;display:flex;align-items:center;justify-content:center;background:#0a100bd9;z-index:3;padding:24px}[hidden]{display:none!important}.card{width:min(840px,100%);padding:44px;border:1px solid #ffffff18;background:linear-gradient(135deg,#202a23,#111813);border-radius:12px;box-shadow:0 30px 120px #0007}.eyebrow{color:var(--mint);font:12px monospace;letter-spacing:3px}h1{font-size:clamp(42px,6vw,78px);line-height:1.04;letter-spacing:-3px;margin:24px 0}h1 em{font-style:normal;color:var(--mint)}h2{font-size:34px;margin:18px 0}p{color:#a7b0a7;line-height:1.8}.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}.divider{height:1px;background:#ffffff14;margin:28px 0}.info{display:flex;gap:36px;margin-top:32px}.info b{display:block;margin-bottom:8px}.info span{color:var(--muted);font-size:12px}kbd{background:#29332c;border:1px solid #52604e;border-radius:4px;padding:3px 7px}.error{color:#ff9c86;min-height:22px;margin-top:12px}.hud{position:fixed;top:100px;left:28px;right:28px;pointer-events:none;display:flex;justify-content:space-between}.stat{background:#111a15dc;border:1px solid #ffffff18;padding:14px 18px;border-radius:7px;min-width:190px}.health{height:5px;background:#ffffff15;margin:10px 0}.health i{display:block;height:100%;background:var(--mint)}.clock{font:32px monospace;letter-spacing:3px}.footer{position:fixed;bottom:24px;left:28px;right:28px;display:flex;justify-content:space-between;align-items:end;pointer-events:none;color:#8e9c8e;font-size:12px}.xp{width:260px}.choices{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.choices button{text-align:left;min-height:140px}.choices strong{display:block;font-size:20px;margin:12px 0}.choices small{line-height:1.7;color:#a8b6a0}#net{color:var(--mint)}@media(max-width:700px){.card{padding:24px}.info{gap:16px}.tag{display:none}.stat{min-width:140px}.choices{grid-template-columns:1fr}}
</style></head><body>
<canvas id="world"></canvas><header><div class="brand"><span>▦</span> AFTER HOURS <span class="tag"> / PC방 생존자</span></div><div class="row"><span id="net" class="tag">2 PLAYER ONLINE CO-OP</span><button id="pause" hidden>일시정지 P</button></div></header>
<div class="hud" id="hud" hidden></div><div class="footer"><span>WASD / 방향키 이동 &nbsp; · &nbsp; 자동 공격 &nbsp; · &nbsp; P 일시정지</span><div class="xp" id="xp"></div></div>
<section class="panel" id="panel"><div class="card" id="content"></div></section>
<script src="config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.107.0/dist/umd/supabase.js"></script>
<script src="engine.js"></script><script src="network.js"></script>
<script>
const $=id=>document.getElementById(id),canvas=$('world'),ctx=canvas.getContext('2d');let session=null,source=null,snap=null,screen='',keys={},camera={x:0,y:0},w=innerWidth,h=innerHeight,connected=false;
const time=t=>`${String(Math.floor(t/60)).padStart(2,'0')}:${String(Math.floor(t%60)).padStart(2,'0')}`;
async function api(path,extra={}){if(!source)throw Error('먼저 방에 참가해 주세요.');if(path==='/input')source.input(extra.keys);else source.action(path,{...extra,level:snap?.level});return {ok:true};}
function error(e){const el=$('error');if(el)el.textContent=e.message;else $('net').textContent=e.message;}
function lobby(){screen='lobby';$('panel').hidden=false;$('content').innerHTML=`<div class="eyebrow">SURVIVE TOGETHER. UNTIL MORNING.</div><h1>오늘 야간은<br><em>둘이서 버틴다.</em></h1><p>불 꺼진 PC방, 끝없이 몰려오는 감염자들.<br>친구와 각자의 컴퓨터에서 접속해 10분 동안 살아남으세요.</p><div class="divider"></div><div class="row"><button class="primary" id="create">새 방 만들기 ↗</button><span style="color:#7e897b">또는</span><input id="code" maxlength="6" placeholder="방 코드" aria-label="방 코드"><button id="join">친구 방 참가</button></div><div class="error" id="error"></div><div class="info"><div><b>01 / 초대</b><span>방 코드를 친구에게 공유</span></div><div><b>02 / 생존</b><span>자동 공격 · 함께 성장</span></div><div><b>03 / 구조</b><span>쓰러진 친구 곁에서 3초</span></div></div>`;$('create').onclick=()=>enter('/create');$('join').onclick=()=>enter('/join',{room:$('code').value.trim()});$('code').onkeydown=e=>{if(e.key==='Enter')$('join').click();};}
async function enter(path,data={}){if(window.joining)return;window.joining=true;try{source?.close();source=new OnlineGame(s=>{snap=s;if(session)ui();},ok=>{connected=ok;if(session)$('net').textContent=ok?`ROOM ${session.room} · YOU ${session.slot+1}P`:'연결 복구 중…';});session=await source.open(path==='/create',(data.room||'').toUpperCase());$('net').textContent=`ROOM ${session.room} · YOU ${session.slot+1}P`;if(snap)ui();}catch(e){source?.close();source=null;session=null;connected=false;error(e);}finally{window.joining=false;}}

function action(path,data){api(path,data).catch(error);}
function ui(){const s=snap;$('pause').hidden=!['playing','paused'].includes(s.state);$('hud').hidden=false;$('hud').innerHTML=`<div>${s.players.map(p=>`<div class="stat" style="margin-bottom:8px"><b style="color:${p.slot?'#a7b6ff':'#bcff69'}">${p.slot+1}P ${p.slot===session.slot?'YOU':'PARTNER'}</b><span style="float:right">${p.online?'●':'연결 끊김'}</span><div class="health"><i style="width:${p.hp/p.max*100}%;background:${p.slot?'#a7b6ff':'#bcff69'}"></i></div><small>${p.hp>0?Math.ceil(p.hp)+' / '+p.max:'구조 대기 · '+p.revive.toFixed(1)+' / 3초'}</small></div>`).join('')}</div><div class="stat" style="align-self:start;text-align:right"><div class="clock">${time(s.time)}</div><small> / 10:00 &nbsp; · &nbsp; ${s.kills} KILLS</small></div>`;$('xp').innerHTML=`TEAM LEVEL ${s.level}<div class="health"><i style="width:${s.xp/(s.level*50)*100}%"></i></div>`;
  let next=s.state+(s.state==='waiting'?s.players.map(p=>p.online).join():s.state==='upgrade'?s.level:'');if(screen===next)return;screen=next;$('panel').hidden=s.state==='playing';if(s.state==='playing')return;
  const box=$('content');
  if(s.state==='waiting'){box.innerHTML=`<div class="eyebrow">FRIENDS LOBBY / ${s.players.length} OF 2</div><h2>같이 야간 뛸 친구를 초대하세요.</h2><p>친구가 같은 사이트를 열고 아래 방 코드를 입력하면 됩니다.</p><h1 style="color:var(--mint);letter-spacing:10px">${s.code}</h1><p>${s.players.length===2?'두 명이 모였습니다. 방장이 시작할 수 있습니다.':'친구의 접속을 기다리는 중…'}</p><button class="primary" id="start" ${session.slot!==0||s.players.length!==2||s.players.some(p=>!p.online)?'disabled':''}>둘이서 시작하기 →</button><div id="error" class="error"></div>`;$('start').onclick=()=>action('/start');}
  else if(s.state==='upgrade'){box.innerHTML=`<div class="eyebrow">TEAM UPGRADE / LEVEL ${s.level}</div><h2>같이 더 강해질 시간.</h2><p>한 명이 선택하면 두 사람 모두에게 적용됩니다. 숫자 1 · 2 · 3으로도 선택할 수 있습니다.</p><div class="choices">${s.choices.map((c,i)=>`<button data-choice="${c[0]}"><span class="eyebrow">0${i+1}</span><strong>${c[1]}</strong><small>${c[2]}</small></button>`).join('')}</div>`;box.querySelectorAll('[data-choice]').forEach(b=>b.onclick=()=>action('/choose',{choice:b.dataset.choice}));}
  else if(['paused','disconnected'].includes(s.state)){box.innerHTML=`<div class="eyebrow">TAKE A BREATH</div><h2>${s.state==='paused'?'잠깐, 쉬어갑시다.':'친구의 연결을 기다립니다.'}</h2><p>두 사람의 게임이 함께 멈췄습니다. 연결이 복구되면 이어서 플레이하세요.</p><button class="primary" id="resume">계속하기 →</button>`;$('resume').onclick=()=>action('/pause');}
  else{let best=0;try{best=Number(localStorage.getItem('after-hours-best'))||0;localStorage.setItem('after-hours-best',Math.max(best,s.time));}catch{}box.innerHTML=`<div class="eyebrow">SHIFT COMPLETE</div><h2>${s.state==='won'?'우리는 아침을 맞았다.':'오늘의 야간근무 종료.'}</h2><p>생존 ${time(s.time)} &nbsp; / &nbsp; ${s.kills} 처치 &nbsp; / &nbsp; 팀 레벨 ${s.level}<br>이 브라우저 최고 생존 기록 ${time(Math.max(best,s.time))}</p><button class="primary" id="restart" ${session.slot!==0?'disabled':''}>다시 시작 →</button><p>${session.slot!==0?'방장이 다시 시작할 수 있습니다.':''}</p>`;$('restart').onclick=()=>action('/start');}
}
function resize(){w=innerWidth;h=innerHeight;const d=Math.min(devicePixelRatio||1,2);canvas.width=w*d;canvas.height=h*d;ctx.setTransform(d,0,0,d,0,0);}addEventListener('resize',resize);resize();
function circle(x,y,r,color){ctx.beginPath();ctx.arc(x,y,r,0,Math.PI*2);ctx.fillStyle=color;ctx.fill();}
function render(){ctx.fillStyle='#111916';ctx.fillRect(0,0,w,h);const me=snap?.players[session?.slot];if(me){camera.x+=(me.x-camera.x)*.2;camera.y+=(me.y-camera.y)*.2;}const scale=Math.min(w/1280,h/800);ctx.save();ctx.translate(w/2,h/2);ctx.scale(scale,scale);ctx.translate(-camera.x,-camera.y);const hw=w/scale/2,hh=h/scale/2;
  ctx.strokeStyle='#ffffff06';ctx.lineWidth=1;for(let x=Math.floor((camera.x-hw)/64)*64;x<camera.x+hw;x+=64){ctx.beginPath();ctx.moveTo(x,camera.y-hh);ctx.lineTo(x,camera.y+hh);ctx.stroke();}for(let y=Math.floor((camera.y-hh)/64)*64;y<camera.y+hh;y+=64){ctx.beginPath();ctx.moveTo(camera.x-hw,y);ctx.lineTo(camera.x+hw,y);ctx.stroke();}
  for(let x=Math.floor((camera.x-hw)/512)*512;x<camera.x+hw;x+=512)for(let y=Math.floor((camera.y-hh)/384)*384;y<camera.y+hh;y+=384){ctx.fillStyle='#1c2821';ctx.fillRect(x+130,y+80,170,52);ctx.fillStyle='#304135';ctx.fillRect(x+145,y+85,54,20);ctx.fillRect(x+230,y+85,54,20);ctx.fillStyle='#536649';ctx.fillRect(x+150,y+101,44,2);ctx.fillRect(x+235,y+101,44,2);ctx.fillStyle='#253229';ctx.fillRect(x+160,y+140,28,18);ctx.fillRect(x+245,y+140,28,18);ctx.fillStyle='#40513c';ctx.font='10px monospace';ctx.fillText('NIGHT ZONE / '+Math.abs(x/512+y/384),x+130,y+60);}
  if(snap){for(const o of snap.orbs){ctx.fillStyle='#9eed72';ctx.fillRect(o.x-3,o.y-3,6,6);}for(const e of snap.enemies){circle(e.x,e.y,e.size+4,'#ff796815');circle(e.x,e.y,e.size,e.boss?'#bf80ed':e.fast?'#ffbd69':'#d77765');ctx.fillStyle='#302120';ctx.fillRect(e.x-6,e.y-4,4,4);ctx.fillRect(e.x+3,e.y-4,4,4);if(e.boss){ctx.fillStyle='#332344';ctx.fillRect(e.x-45,e.y-49,90,5);ctx.fillStyle='#dcabff';ctx.fillRect(e.x-45,e.y-49,90*e.hp/e.max,5);ctx.fillStyle='#e6c7ff';ctx.font='12px monospace';ctx.fillText('점장 AI',e.x-25,e.y-59);}}
  for(const b of snap.bullets){circle(b.x,b.y,4,b.owner?'#c3ceff':'#e2ffa0');}
  for(const p of snap.players){const color=p.slot?'#a7b6ff':'#bcff69';ctx.globalAlpha=p.hp<=0?.4:p.inv>0?.65:1;circle(p.x,p.y,25,color+'16');circle(p.x,p.y,16,color);ctx.fillStyle='#172419';ctx.fillRect(p.x-8,p.y-6,16,8);ctx.fillStyle='#edfbdc';ctx.fillRect(p.x+2,p.y-5,4,4);ctx.globalAlpha=1;ctx.fillStyle=color;ctx.font='bold 12px monospace';ctx.textAlign='center';ctx.fillText(p.hp>0?`${p.slot+1}P`:'구조 필요',p.x,p.y-33);if(p.hp<=0){ctx.strokeStyle=color;ctx.beginPath();ctx.arc(p.x,p.y,26,-Math.PI/2,-Math.PI/2+Math.PI*2*p.revive/3);ctx.stroke();}}ctx.textAlign='left';}
  ctx.restore();if(snap&&me){const other=snap.players.find(p=>p.slot!==me.slot);if(other){const dx=(other.x-camera.x)*scale,dy=(other.y-camera.y)*scale;if(Math.abs(dx)>w/2-65||Math.abs(dy)>h/2-120){const factor=Math.min((w/2-65)/Math.max(1,Math.abs(dx)),(h/2-120)/Math.max(1,Math.abs(dy)));ctx.fillStyle='#a7b6ff';ctx.font='bold 14px system-ui';ctx.fillText('◆ 친구',w/2+dx*factor,h/2+dy*factor);}}}requestAnimationFrame(render);}render();
const bindings={KeyW:'up',ArrowUp:'up',KeyS:'down',ArrowDown:'down',KeyA:'left',ArrowLeft:'left',KeyD:'right',ArrowRight:'right'};const held=new Set();
function input(){keys={};for(const code of held)if(bindings[code])keys[bindings[code]]=true;}
addEventListener('keydown',e=>{if(e.target.tagName==='INPUT')return;if(bindings[e.code]){e.preventDefault();held.add(e.code);input();}if(e.repeat)return;if(e.code==='KeyP'&&session)action('/pause');if(snap?.state==='upgrade'&&/^Digit[123]$/.test(e.code))action('/choose',{choice:snap.choices[Number(e.code.slice(-1))-1][0]});});addEventListener('keyup',e=>{held.delete(e.code);input();});addEventListener('blur',()=>{held.clear();input();});let sending=false;setInterval(async()=>{if(!session||!connected||sending)return;sending=true;try{await api('/input',{keys});}catch{}finally{sending=false;}},66);$('pause').onclick=()=>action('/pause');lobby();
</script></body></html>
